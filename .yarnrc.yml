compressionLevel: mixed

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 3d

npmScopes:
  # The shared abi config packages are public on npmjs.org. This entry exists to
  # override a developer's global yarnrc, which may route this scope to GitHub
  # Packages; without it, install fails with an authentication error.
  abinnovision:
    npmAlwaysAuth: false
    npmRegistryServer: "https://registry.npmjs.org"
  stillmap:
    npmAlwaysAuth: false
    npmPublishRegistry: "https://registry.npmjs.org"
    npmRegistryServer: "https://registry.npmjs.org"

plugins:
