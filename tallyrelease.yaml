# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@tallyrelease/cli@0/dist/tallyrelease.schema.json
plugins:
  node: {}

defaults:
  # Matches the existing tags
  tagFormat: "{id}-v{version}"
  initialVersion: 0.1.0

branches:
  - name: main
    line: default
    channel: beta

units:
  packages/core: { release: true, tags: [dist] }
  packages/sources: { release: true, tags: [dist] }
  packages/react: { release: true, tags: [dist] }
  packages/serve: { release: true, tags: [dist] }
  packages/styles: { release: true, tags: [dist] }
  packages/cli: { id: cli, release: true, tags: [dist] }

# Released together under one version.
groups:
  stillmap:
    units: [core, sources, react, serve, styles, cli]

# Changes here rebuild every unit (added to the node plugin defaults:
# yarn.lock, .yarnrc.yml, root package.json, tsconfig*.json, turbo.json).
globalInputs:
  - .tool-versions

ignore:
  - "*.md"
  - .github/**
  - .husky/**
  - .devcontainer/**
  - .codesandbox/**
  - .editorconfig
  - .gitattributes
